# ODS Validate — Dogfooding workflow for the validate-action repository
#
# Runs AI code quality gate on every PR to main.

name: ODS Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dogfooding installs the CLI at a fresh commit SHA; sum.golang.org
      # intermittently 500s while verifying an unreleased pseudo-version.
      # Skip checksum-DB verification here — this is our own just-built
      # code, and adopters pinned to a released tag are unaffected.
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The PR head by SHA: the real commits under review rather than the
          # synthetic merge commit, and it resolves for pull requests from
          # forks too — github.head_ref is a branch that exists only in the fork.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Conventional branch & commit checks
        run: |
          python3 -m pip install 'commit-check>=2.9.0'
          commit-check --message --branch

      # The policy is the open-source disclosure template from the spec
      # (examples/ods-policy-oss-disclosure.rego, copied to .ods/policy.rego):
      # disclose it, test it, own it. Review routing labels the PR with its
      # tier and asks a maintainer to look at changes the policy marks elevated.
      - name: ODS AI code quality gate
        uses: open-delivery-spec/validate-action@72bb6d3c0b7ebf6793cf208ffa5d9c7f671af5d4 # v1
        with:
          diff-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          branch: ${{ github.head_ref }}
          summary: 'true'
          comment: 'true'
          review-routing: 'true'
          elevated-reviewers: 'shenxianpeng'
